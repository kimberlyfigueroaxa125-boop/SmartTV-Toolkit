name: Windows Build

on:
  push:
    branches: [main, "ui/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile Python
        run: python -m compileall -q app.py smarttv_toolkit
      - name: Build executable
        run: pyinstaller --noconfirm --clean SmartTV-Toolkit.spec
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-Toolkit-Windows
          path: dist/SmartTV-Toolkit.exe
          if-no-files-found: error
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: gh release upload $env:TAG_NAME dist/SmartTV-Toolkit.exe --clobber
